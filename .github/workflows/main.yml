name: Build sxapay APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show project files
        run: |
          echo "=== PROJECT ==="
          pwd
          ls -la
          echo "=== DIRECTORIES ==="
          find . -maxdepth 3 -type f | sort | head -200

      - name: Build sxapay
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f "./sxapay_Android/gradlew" ]; then
            chmod +x ./sxapay_Android/gradlew
            ./sxapay_Android/gradlew assembleDebug --no-daemon
          else
            echo "Gradle project tidak ditemukan."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sxapay-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
